name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

# Permissions required by bazel-contrib/.github/release_ruleset:
#   contents: write    - upload release files
#   id-token: write    - sign attestations via OIDC
#   attestations: write - upload signed attestations
permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    # Reusable workflow from bazel-contrib that:
    #   - runs `bazel test //...`
    #   - runs .github/workflows/release_prep.sh which writes the
    #     release archive(s) and the docs tarball
    #   - generates SLSA build provenance attestations over the
    #     release files (one .intoto.jsonl per archive)
    #   - publishes a GitHub Release with everything attached
    #
    # See https://github.com/bazel-contrib/bazel-central-registry/discussions/2721
    # for the BCR provenance design these attestations implement.
    uses: bazel-contrib/.github/.github/workflows/release_ruleset.yaml@v7.5.0
    with:
      # //tests/ctan:* needs the CTAN fixture mirror running before
      # bazel test, the same way the main CI workflow sets it up.
      # Without it, transitive_resolve_test 404s against real CTAN
      # (test-pkg-a / test-pkg-b are synthetic, not real CTAN
      # packages — they only exist as fixtures in
      # tests/ctan/fixtures/). The mirror also keeps the lipsum +
      # biblatex tests flake-free, since real CTAN occasionally
      # times out.
      bazel_test_command: |
        set -e
        python3 -m http.server 8765 --directory tests/ctan/fixtures \
          > /tmp/ctan_fixtures.log 2>&1 &
        CTAN_FIXTURE_PID=$!
        trap 'kill $CTAN_FIXTURE_PID 2>/dev/null || true' EXIT
        for _ in 1 2 3 4 5; do
          if curl -fsS http://127.0.0.1:8765/README.md > /dev/null 2>&1; then
            break
          fi
          sleep 1
        done
        bazel test //... //tests/... \
          --test_env=RULES_LATEX_CTAN_MIRROR=http://127.0.0.1:8765
      prerelease: false
      release_files: |
        rules_latex-*.tar.gz
      # The reusable workflow generates release notes automatically.
      # Our release_prep.sh prepends its own preamble (BCR submission
      # snippet etc.) for module consumers.
      generate_release_notes: true

  # Auto-publish to the Bazel Central Registry once the release
  # itself is up. The BCR_PUBLISH_TOKEN secret needs to be configured
  # under repo settings (Classic PAT with repo + workflow scopes).
  # If the secret is missing, the publish job will fail loudly; that
  # failure doesn't break the release that already went out, just
  # the BCR submission step.
  #
  # ----- TEMPORARILY DISABLED -----
  # The first-time BCR onboarding PR for rules_latex
  # (bazelbuild/bazel-central-registry#8911 → superseded by the
  # next manual submission) is still under review. Until that PR
  # lands, we don't want every release to spam BCR with new-version
  # PRs that won't get reviewed alongside the in-flight onboarding.
  #
  # When the first PR merges, flip `if: false` to remove the gate
  # (or delete the conditional entirely). The publish.yml workflow
  # is unaffected by this gate — it remains invocable via
  # workflow_dispatch for manual / one-off triggers.
  publish-to-bcr:
    if: false
    needs: release
    uses: ./.github/workflows/publish.yml
    with:
      tag_name: ${{ github.ref_name }}
    secrets:
      publish_token: ${{ secrets.BCR_PUBLISH_TOKEN }}
    permissions:
      contents: write
      id-token: write
      attestations: write
